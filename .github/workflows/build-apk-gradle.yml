name: Build APKs (Gradle on runner)

# ---------------------------------------------------------------------------
# Alternative to EAS Build: runs `expo prebuild` + Gradle directly on a
# GitHub-hosted Ubuntu runner. No Expo account needed.
#
# Required repository secrets:
#   KEYSTORE_BASE64      — base64 of your release keystore (.jks / .keystore)
#   KEYSTORE_PASSWORD    — password for the keystore
#   KEY_ALIAS            — key alias inside the keystore
#   KEY_PASSWORD         — password for that key
#
# Generate a keystore once with:
#   keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 \
#     -validity 10000 -alias release
#   base64 -w0 release.jks    # paste result into KEYSTORE_BASE64
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  build-user-app:
    name: "User App → APK (Gradle)"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_DIR: user-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/release.jks"

      - name: Write keystore.properties
        working-directory: ${{ env.APP_DIR }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$HOME/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Expo prebuild (generates android/ project)
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      # Re-apply keystore config because `prebuild --clean` wipes android/.
      - name: Re-write keystore.properties + sign release build
        working-directory: ${{ env.APP_DIR }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$HOME/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

          # Point the release buildType at the keystore.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          inject = '''
              signingConfigs {
                  release {
                      storeFile file(System.getProperty("user.home") + "/release.jks")
                      storePassword project.findProperty("storePassword") ?: System.getenv("KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("keyAlias") ?: System.getenv("KEY_ALIAS")
                      keyPassword project.findProperty("keyPassword") ?: System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs" not in s:
              s = s.replace("android {", "android {" + inject, 1)
          s = s.replace(
              "release {",
              "release {\n                signingConfig signingConfigs.release",
              1,
          )
          p.write_text(s)
          PY

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk" dist/sms-sync-user.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sms-sync-user-apk
          path: dist/sms-sync-user.apk
          if-no-files-found: error

  build-admin-app:
    name: "Admin App → APK (Gradle)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_DIR: admin-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Expo prebuild
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK (admin app needs no custom native code)
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" dist/sms-sync-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sms-sync-admin-apk
          path: dist/sms-sync-admin.apk
          if-no-files-found: error
